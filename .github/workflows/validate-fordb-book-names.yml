name: Validate ForDB book names

# מאמת את *כל* קבצי ForDB בשתי שכבות לפני בניית הספרייה:
#   1. בדיקת שמות מהירה מול קבצי הספרים הנארזים והקטלוג החי של ספריא.
#   2. validateForDbInputs של SeforimLibrary על מסד הנתונים האחרון: אותם parsers,
#      אותם appliers ובאותו סדר כמו בריצה האמיתית. השכבה הזו מכסה category/book
#      renames+moves, generations, all_metadata ושינויי המטא-דאטה של ספרים וקטגוריות.
# ב-push ל-main השכבה המהירה מסירה ודוחפת תיקונים דטרמיניסטיים בלבד (שורות ספר
# יתומות ב-generations/book_info/book_moves וכפילויות מקור-ספריא). ב-PR היא report-only.
# לפני ההסרה היא עוקבת אחרי שינויי-שם של קבצי ספרים בקומיטים שטרם אומתו: שורה
# שהתייתמה רק כי הקובץ שונה בשמו מקבלת את השם החדש בכל קובץ שמזהה ספר לפי שם
# (ForDB, metadata.json, קבצי הקישורים) במקום להימחק (fordb_book_renames.py).
# כל כשל שאינו ניתן לתיקון בטוח, או כשל בשכבת ה-runtime, מפיל את ה-CI וחוסם בנייה.

on:
  # רק main. תגי ה-handoff של הסאגה (manual-links-refresh-report-*, saga-state-*,
  # library-links-*, pipeline-result-*, saga-complete-*) מצביעים על אותו עץ, וכל תג
  # הפעיל ריצה מלאה נוספת ש-concurrency לא יכול לאחד כי כל תג הוא ref נפרד.
  # ענפים נבדקים דרך pull_request, וה-auto-fix דוחף ל-main ולכן ממשיך לאמת את עצמו.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # נדרש רק ל-auto-fix push שרץ ב-main; מאז סינון ה-branches ההרשאה כבר לא ניתנת
  # על ref של תג שרירותי, וב-PR ובהרצה ידנית אין כתיבה בפועל.
  contents: write
  # לאיתור הריצה המוצלחת האחרונה — הבסיס למעקב אחרי שינויי-שם.
  actions: read

concurrency:
  group: validate-fordb-book-names-${{ github.ref }}
  # auto-fix דוחף commit חדש; אסור שהריצה החדשה תבטל את הריצה שעדיין מאמתת את
  # התוכן המתוקן. ב-PR עדיין מבטלים ריצה ישנה כדי לחסוך משאבים.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # כולל הורדת seforim.db, קומפילציית כלי ה-Kotlin והרצת כל צרכני ForDB.
    timeout-minutes: 180

    env:
      ARCHIVE_NAME: fordb_candidate.zip

    steps:
      # partial-clone (ללא תוכן קבצי הספרים) + hydration רק לקלטים הנדרשים.
      # fetch-depth: 0 מושך את כל הקומיטים והעצים בלי blobs (כ-17MB): זיהוי שינויי-שם
      # צריך את ההיסטוריה שמאז הריצה המוצלחת האחרונה, ו-git מושך בעצמו רק את ה-blobs
      # של קומיטים שיש בהם גם מחיקה וגם הוספה של ספר.
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /ForDB/
            /.github/scripts/
            /MoreBooks/אוצר ההלכה - סקריפטים/install.py
            /MoreBooks/משנה הלכות - סקריפטים/install.py
            /MoreBooks/משלי עם הגרא ורבינו יונה - סקריפטים/install.py
            /.claude/skills/otzaria-book-format/scripts/make_metadata.py
            /all_metadata_with_file_paths.json
            /manual_links_packaging.py
          sparse-checkout-cone-mode: false
          # PAT ב-main גורם ל-auto-fix push להפעיל את השערים מחדש. ב-fork PR אין
          # גישה לסוד ולכן נופלים ל-token המובנה, המשמש לקריאה בלבד בפועל.
          token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PIPELINE_TOKEN || github.token }}

      - name: Hydrate validation inputs from LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="ForDB/**,all_metadata_with_file_paths.json" --exclude=""
          test -d ForDB
          test -f all_metadata_with_file_paths.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # בדיקות ה-offline של המאמת עצמו (db_title, find_spelling_drift,
      # find_dead_renames) מול קבצי ForDB ועץ הספרים המחויב — שניות ספורות, אותו
      # runner, ללא רשת וללא seforim.db. רצות לפני הכלי כדי שבאג במאמת ייפול כאן.
      # manual_links_packaging.py נמשך ב-sparse בדיוק עבור הצעד הזה:
      # PackagedRootsContractTest הוא האכיפה היחידה של DB_BOOK_PREFIXES ≡ BOOK_ROOTS,
      # והוא מדלג על עצמו כשהקובץ חסר.
      - name: Self-test the ForDB name validator
        working-directory: .github/scripts
        env:
          SEFARIA_FETCH: "0"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          python3 -m unittest test_validate_fordb_book_names test_fordb_book_renames test_book_info_writer -v

      # שינויי-שם נעקבים מהקומיט האחרון שהזרימה הזו אימתה *בהצלחה*, לא רק מ-
      # github.event.before: ריצה שנכשלה (למשל כשה-push של ה-auto-fix הפסיד במרוץ, כמו
      # הריצה של 5f94e9ec) או ריצה ממתינה שה-concurrency החליף משאירות את שינויי-השם
      # שלהן בלי טיפול, וטווח הדחיפה הבאה לא רואה אותם — כך נמחקה ב-bccfea27 שורת
      # generations של ספר חי. המאמת בוחר את המועמד הראשון שהוא אב של HEAD.
      # רק ריצות push: ריצה ידנית היא report-only, והצלחתה אינה אומרת ששינויי-שם יושרו.
      - name: Resolve the rename-follow base
        id: rename_base
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bases="$PR_BASE"
          else
            last_ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-fordb-book-names.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
            if [ -z "$last_ok" ]; then
              echo "::warning::No successful run found; following renames from the pushed range only"
            fi
            bases="$last_ok ${BEFORE:-}"
          fi
          echo "bases=$bases" >> "$GITHUB_OUTPUT"

      # exit 1 = נשארה בעיה שאסור לתקן בניחוש (כולל שינוי-שם שלא ניתן ליישר בבטחה —
      # שורותיו נשמרות); exit 2 = ספריא לא זמינה. במקרה השני --fix יוצא לפני כל כתיבה,
      # ולכן כשל רשת לעולם לא מוחק נתון תקין.
      - name: Validate names, follow book renames and auto-remove safe orphans on main
        id: names
        env:
          SEFARIA_FETCH: "1"
          PYTHONIOENCODING: "utf-8"
          RENAME_BASES: ${{ steps.rename_base.outputs.bases }}
        run: |
          set -euo pipefail
          base_args=()
          for base in $RENAME_BASES; do
            base_args+=(--rename-base "$base")
          done
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 .github/scripts/validate_fordb_book_names.py --fix "${base_args[@]}"
            if [ -f fordb_touched.txt ]; then
              echo "fixed=true" >> "$GITHUB_OUTPUT"
            else
              echo "fixed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            python3 .github/scripts/validate_fordb_book_names.py "${base_args[@]}"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      # אורזים בדיוק את המועמד הנוכחי, כדי שכל תהליכי SeforimLibrary יקראו payload
      # יחיד וממוען-תוכן — ללא תלות ב-fordb_latest_pointer.json שעדיין מצביע ל-last-good.
      - name: Create deterministic candidate archive
        run: |
          set -euo pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("ForDB")
          expected = {
              "ForDB/all_metadata.json",
              # מידע על ספרים מהאתר. יחליף את generations.csv כמקור הדור כשהצרכן שלו
              # ב-SeforimLibrary (seedGenerations/validateForDbInputs) ימוזג.
              "ForDB/book_info.csv",
              "ForDB/book_moves.csv",
              "ForDB/book_renames.csv",
              "ForDB/category_moves.csv",
              "ForDB/category_renames.csv",
              "ForDB/generations.csv",
              "ForDB/sefaria_author_changes.csv",
              "ForDB/sefaria_category_changes.csv",
              "ForDB/sefaria_metadata_changes.csv",
          }
          paths = sorted(
              (path for path in root.rglob("*") if path.name != ".DS_Store" and path.as_posix() != "ForDB/book_info_identity.json"),
              key=lambda path: path.as_posix().encode(),
          )
          if any(path.is_symlink() for path in paths):
              raise SystemExit("ForDB archive refuses symlinks")
          actual = {path.as_posix() for path in paths if path.is_file()}
          if actual != expected:
              missing = sorted(expected - actual)
              unknown = sorted(actual - expected)
              raise SystemExit(
                  "ForDB consumer coverage is incomplete; "
                  f"missing={missing}, files without a runtime validator={unknown}"
              )
          with zipfile.ZipFile(
              "fordb_candidate.zip",
              "w",
              compression=zipfile.ZIP_STORED,
          ) as archive:
              for path in paths:
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(path.as_posix(), date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_STORED
                  archive.writestr(info, path.read_bytes())
          PY

      - name: Free disk space for the full ForDB dry-run
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Checkout the runtime ForDB consumers
        uses: actions/checkout@v6
        with:
          repository: Otzaria/SeforimLibrary
          ref: otzaria
          token: ${{ github.token }}
          path: seforim-tool
          persist-credentials: false

      # ה-release האחרון כולל את עץ הקטגוריות והספרים הקרוב ביותר לקלט של הבנייה
      # הבאה. validateForDbInputs מעתיקה אותו, קוראת את כל שמונת קבצי ForDB דרך
      # הקוראים האמיתיים, ומחילה על העותק את כל שלבי ה-runtime; המקור נשאר ללא שינוי.
      - name: Validate every ForDB file with the real runtime consumers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIB_TAG=$(gh release list -R Otzaria/SeforimLibrary --exclude-pre-releases \
            --exclude-drafts -L1 --json tagName -q '.[0].tagName')
          test -n "$LIB_TAG"
          echo "Validating every ForDB input against SeforimLibrary release $LIB_TAG"

          # The buildstate travels with the DB: without it the validator's allocator starts
          # from zero and every pub_date/pub_place id check fails against the real DB.
          for asset in seforim.db.zst seforim.db.buildstate.zst; do
            gh release download "$LIB_TAG" \
              -R Otzaria/SeforimLibrary \
              -p "$asset" \
              -D dbdir
            ASSET_DIGEST=$(gh release view "$LIB_TAG" \
              -R Otzaria/SeforimLibrary \
              --json assets \
              --jq ".assets[] | select(.name==\"$asset\") | .digest")
            [[ "$ASSET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(sha256sum "dbdir/$asset" | cut -d' ' -f1)" == "${ASSET_DIGEST#sha256:}" ]]

            unzstd -f "dbdir/$asset"
            rm -f "dbdir/$asset"
          done
          CANDIDATE_SHA=$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)
          (
            cd seforim-tool
            chmod +x gradlew
            ./gradlew :sefariasqlite:validateForDbInputs \
              -PseforimDb="$GITHUB_WORKSPACE/dbdir/seforim.db" \
              -PforDbArchive="$GITHUB_WORKSPACE/$ARCHIVE_NAME" \
              -PforDbSha256="$CANDIDATE_SHA" \
              --no-daemon
          )

      # Commit only after candidate archive and runtime validation succeed.
      # המאמת כותב את הנתיבים שנגע בהם (כולל metadata.json וקבצי קישורים ששמם שונה)
      # ואת הודעת הקומיט. אם ה-push מפסיד במרוץ, הריצה נכשלת ואינה "מוצלחת", ולכן
      # הריצה הבאה עוקבת שוב מאותו בסיס — שום שינוי-שם לא הולך לאיבוד.
      - name: Commit and push safe ForDB fixes
        if: ${{ steps.names.outputs.fixed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --pathspec-from-file=fordb_touched.txt --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "::error::fordb_touched.txt exists but no change was staged"
            exit 1
          fi
          git commit -F fordb_commit_message.txt
          git push origin HEAD:main
