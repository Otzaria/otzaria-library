name: Validate ForDB book names

# מוודא שכל שמות הספרים בקבצי ForDB קיימים *בדיוק כצורתם* ברשימת הספרים שתיבנה ב-DB.
# report-only: הבדיקה מדווחת ומפילה את הריצה — לעולם אינה משכתבת את ForDB. מחיקה אוטומטית
# של שורות move/rename הייתה מאבדת כוונה אנושית, ותקלת-API של ספריא הייתה מסמנת שורות
# תקינות כיתומות ומוחקת אותן. לכן ב-push ובכל PR האימות רץ במצב דיווח בלבד; כשל חוסם
# מיזוג / מסמן את הקומיט אדום, ואדם מיישב את מה שדווח (הסרה/תיקון של השורה ב-ForDB).
# אותה בדיקה משמשת גם כשער-פרסום ב-update-fordb.yml, כך שהמצביע
# fordb_latest_pointer.json מתקדם רק לתוכן ממוען-תוכן שעבר את כל השערים.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fordb-book-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # partial-clone (ללא תוכן קבצים) + sparse-checkout לתיקיות הנדרשות בלבד.
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            ForDB
            .github
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Report-only: exit 1 = ForDB names need a human fix (block); exit 2 = the Sefaria
      # fetch failed — never validate against a partial canonical list, so block and retry.
      - name: Validate ForDB book names (report-only — never rewrites ForDB)
        env:
          SEFARIA_FETCH: "1"
          PYTHONIOENCODING: "utf-8"
        run: python3 .github/scripts/validate_fordb_book_names.py
