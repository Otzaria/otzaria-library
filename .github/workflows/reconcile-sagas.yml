name: Reconcile event-driven sagas
run-name: reconcile-sagas

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reconcile-sagas
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile every open retained saga
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: bash .github/scripts/reconcile_sagas.sh
