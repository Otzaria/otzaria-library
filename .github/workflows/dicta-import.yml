name: Dicta import

# ייבוא חודשי מספריית דיקטה (DictaToOtzaria/סקריפטים/dicta_sync.py; מסמך: README שם).
#   detect  — books.json + HEAD לכל zip (ה-ETag הוא MD5 של ה-zip) מול dicta_state.json → plan.json.
#             בלי נעילה ובלי הורדת ספרים; יוצא מוקדם כשאין עבודה.
#   import  — הורדה (עד max_books), המרה (dicta_convert), שער איכות (dicta_gate), מיקום (dicta_place),
#             כפילויות/שמות/קישורים, כתיבה. ספר ערוך קיים לעולם אינו נדרס.
# ספר שנכנס לספרייה הנארזת (DictaToOtzaria/ערוך/ספרים/אוצריא + מרשמים) → כל הריצה נפתחת כ-PR
# (promote=pr, ברירת המחדל). ריצה בלי תוספת לספרייה (לא ערוך / ערוך/ספרים/לא ממויין / extraBooks/דיקטה /
# קובצי המצב) נדחפת ישר ל-main.
# הדחיפה ב-PIPELINE_TOKEN: דחיפה ב-GITHUB_TOKEN לא מפעילה את validate-fordb-book-names / python-tests.

on:
  schedule:
    - cron: '0 3 2 * *'          # היום השני בחודש; monthly_update.yml (ספריא) נשאר ביום הראשון
  workflow_dispatch:
    inputs:
      max_books:
        description: max books to download/convert in this run
        required: false
        default: '40'
      promote:
        description: runs that add packaged books go by PR (review) or straight to main
        type: choice
        options: [pr, push]
        default: pr
      no_promote:
        description: keep every book in לא ערוך even if it passes the quality gate
        type: boolean
        default: false
      dry_run:
        description: convert into a scratch dir, commit nothing (the summary shows what would happen)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /DictaToOtzaria/סקריפטים/
            /.github/scripts/
            /manual_links_packaging.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # כפילות תוכן של ספר חדש מול כל הספרייה (גם בשם אחר): אינדקס טביעות של הספרים הנארזים ב-HEAD.
      # נבנה כאן — מחוץ לנעילת הכתיבה — ומתעדכן לפי blob sha (רק ספרים ששונו נמשכים, במנות). המטמון
      # נשמר בכל ריצה במפתח חדש ונטען לפי הקידומת; אם GitHub פינה אותו (7 ימים בלי שימוש) — בנייה מלאה
      # (~2.7GB blobs, ~15 דקות), עדיין בלי לעכב כותבים אחרים. ספרי ספריא: sefaria_fp.dat המחויב.
      - name: Restore the library fingerprint index
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fp
          key: dicta-fp-library-${{ github.run_id }}
          restore-keys: dicta-fp-library-
      - name: Update the library fingerprint index
        env:
          PYTHONIOENCODING: utf-8
        run: python3 DictaToOtzaria/סקריפטים/dicta_sync.py fp-index --library "$RUNNER_TEMP/fp/library_fp.dat"
      - name: Save the library fingerprint index
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fp
          key: dicta-fp-library-${{ github.run_id }}
      - id: plan
        working-directory: DictaToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
          MAX_BOOKS: ${{ inputs.max_books || '40' }}
        run: |
          set -euo pipefail
          python3 dicta_sync.py detect --check-pages --out "$RUNNER_TEMP/plan.json" --max-books "$MAX_BOOKS"
          work=$(python3 -c "import json,sys; print('true' if json.load(open(sys.argv[1]))['items'] else 'false')" "$RUNNER_TEMP/plan.json")
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dicta-plan
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/fp/library_fp.dat

  import:
    needs: detect
    if: needs.detect.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: otzaria-main-writer
      cancel-in-progress: false
      queue: max
    steps:
      # blobless + sparse: עץ המאגר ~10GiB. רק מה שהזרימה קוראת או משכתבת; ספרים אחרים נקראים לפי
      # דרישה (git show — ה-blob נמשך לבד) לבדיקת כפילות, וקבצים חדשים נוספים ב-git add --sparse.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /DictaToOtzaria/סקריפטים/
            /DictaToOtzaria/לא ערוך/
            /*/links/
            /DictaToOtzaria/ערוך/links/
            /.github/
            /ForDB/
            /metadata.json
            /all_metadata_with_file_paths.json
            /manual_links_sync.json
            /manual_links_packaging.py
          sparse-checkout-cone-mode: false
          token: ${{ secrets.PIPELINE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: dicta-plan
          path: ${{ runner.temp }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet -r DictaToOtzaria/סקריפטים/requirements.txt
      - name: Self-test
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest discover -s "DictaToOtzaria/סקריפטים/tests"
      - name: Reconcile human moves, then import
        working-directory: DictaToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
          NO_PROMOTE: ${{ inputs.no_promote && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # תקציב: לא מתחילים ספר חדש אחרי 90 דקות (ה-job מוגבל ל-120) — השאר נדחה לריצה הבאה, מה שהושלם נכנס
          args=(--plan "$RUNNER_TEMP/plan.json" --summary "$GITHUB_STEP_SUMMARY" --library-index "$RUNNER_TEMP/fp/library_fp.dat"
                --time-budget 5400)
          [ "$NO_PROMOTE" = true ] && args+=(--no-promote)
          if [ "$DRY" = true ]; then
            python3 dicta_sync.py import "${args[@]}" --dry-run "$RUNNER_TEMP/dry"
          else
            python3 dicta_sync.py reconcile
            python3 dicta_sync.py import "${args[@]}"
          fi
      - name: Stage and gate
        if: ${{ !inputs.dry_run }}
        id: stage
        env:
          PYTHONIOENCODING: utf-8
          SEFARIA_FETCH: '1'
        run: |
          set -euo pipefail
          git add --sparse -A -- DictaToOtzaria metadata.json ForDB all_metadata_with_file_paths.json
          # extraBooks/דיקטה מחוץ ל-sparse: בלי קובץ חדש שם, pathspec שלו נכשל ב-"did not match any files"
          if [ -d "extraBooks/דיקטה" ]; then git add --sparse -A -- "extraBooks/דיקטה"; fi
          if git diff --cached --quiet; then echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changes=true" >> "$GITHUB_OUTPUT"
          library=false
          if git -c core.quotepath=off diff --cached --name-only | grep -q -e '^DictaToOtzaria/ערוך/ספרים/אוצריא/' -e '^metadata.json$' -e '^ForDB/' -e '^all_metadata_with_file_paths.json$'; then
            library=true
            # שמות ForDB מול העץ המוצע — ADDING_BOOKS §7 (commit זמני, בלי להזיז ענף)
            C=$(git commit-tree "$(git write-tree)" -p HEAD -m "dicta-import candidate")
            python3 .github/scripts/validate_fordb_book_names.py --tree "$C"
          fi
          echo "library=$library" >> "$GITHUB_OUTPUT"
          # מגן קישורים: קובץ נארז ששמו משתתף בקישורים ידניים אסור לו להשתנות בריצה אוטומטית
          git -c core.quotepath=off diff --cached --name-only -z --diff-filter=M -- 'DictaToOtzaria/ערוך/ספרים/אוצריא/' \
            | xargs -0 -r python3 DictaToOtzaria/סקריפטים/dicta_sync.py links-guard
      - name: Commit, then push or open a PR
        if: ${{ !inputs.dry_run && steps.stage.outputs.changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          PROMOTE: ${{ inputs.promote || 'pr' }}
          LIBRARY: ${{ steps.stage.outputs.library }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          msg="דיקטה: ייבוא $(date -u +%Y-%m-%d)"
          lib=("DictaToOtzaria/ערוך/ספרים/אוצריא" metadata.json ForDB all_metadata_with_file_paths.json)
          push_main() {
            for i in 1 2 3; do
              if git pull -q --rebase origin main && git push origin HEAD:main; then return 0; fi
              sleep $((i * 15))
            done
            return 1
          }
          if [ "$LIBRARY" = true ] && [ "$PROMOTE" = pr ]; then
            # 1) החלק הישיר (לא ערוך, ערוך/ספרים/לא ממויין, extraBooks/דיקטה, קובצי המצב) — ל-main.
            #    ספר ב-PR מסומן pending_pr במצב, ולכן detect לא יתכנן אותו שוב עד שה-PR ימוזג.
            git restore --staged -- "${lib[@]}"
            git stash push -q --include-untracked -- "${lib[@]}"
            if ! git diff --cached --quiet; then git commit -q -m "$msg"; push_main; fi
            # 2) רק הספרייה הנארזת והמרשמים — PR מעל main המעודכן.
            br="dicta-import/${GITHUB_RUN_ID}"
            git switch -q -c "$br"
            git stash pop -q
            git add --sparse -A -- "${lib[@]}"
            git commit -q -m "$msg — ספרים לספרייה"
            git push -q origin "$br"
            gh pr create --base main --head "$br" --title "$msg — ספרים לספרייה" \
              --body "ספרי דיקטה שעברו את שער האיכות. סיכום הריצה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            git commit -q -m "$msg"
            push_main
          fi
