name: Weekly Otzaria pipeline

run-name: weekly immutable pipeline ${{ github.run_id }}-${{ github.run_attempt }}

on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-otzaria-pipeline
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
    steps:
      - name: Prepare Otzaria sources, then export Sefaria
        shell: bash
        run: |
          set -euo pipefail

          find_exact_run() {
            local repo="$1" workflow="$2" title="$3" head_sha="$4" dispatched_at="$5"
            local matches=""
            for _ in {1..30}; do
              matches="$(gh run list -R "$repo" -w "$workflow" --event workflow_dispatch --limit 50 \
                --json databaseId,displayTitle,headSha,createdAt,event \
                --jq "[.[] | select(.displayTitle == \"$title\" and .headSha == \"$head_sha\" and .createdAt >= \"$dispatched_at\")] | .[].databaseId")"
              count="$(sed '/^$/d' <<<"$matches" | wc -l | tr -d ' ')"
              if [[ "$count" == 1 ]]; then
                printf '%s\n' "$matches"
                return 0
              fi
              if (( count > 1 )); then
                echo "More than one run matched exact dispatch identity" >&2
                return 1
              fi
              sleep 10
            done
            echo "No exact workflow run appeared for $repo/$workflow" >&2
            return 1
          }

          prepare_correlation="weekly:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:prepare"
          prepare_title="update-library mode=prepare_only correlation=${prepare_correlation}"
          prepare_head="$(gh api repos/Otzaria/otzaria-library/commits/main --jq .sha)"
          prepare_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run update-library.yml -R Otzaria/otzaria-library \
            -f mode=prepare_only \
            -f correlation_id="$prepare_correlation"
          prepare_run="$(find_exact_run Otzaria/otzaria-library update-library.yml "$prepare_title" "$prepare_head" "$prepare_time")"
          gh run watch "$prepare_run" -R Otzaria/otzaria-library --exit-status

          # SefariaExport publishes an immutable release and dispatches the link
          # sync itself.  The weekly orchestrator neither races a publisher nor
          # chooses downstream release inputs.
          export_head="$(gh api repos/Otzaria/SefariaExport/commits/main --jq .sha)"
          export_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release.yml -R Otzaria/SefariaExport

          export_runs=""
          for _ in {1..30}; do
            export_runs="$(gh run list -R Otzaria/SefariaExport -w release.yml --event workflow_dispatch --limit 50 \
              --json databaseId,headSha,createdAt,event \
              --jq "[.[] | select(.headSha == \"$export_head\" and .createdAt >= \"$export_time\")] | .[].databaseId")"
            count="$(sed '/^$/d' <<<"$export_runs" | wc -l | tr -d ' ')"
            [[ "$count" == 0 ]] || break
            sleep 10
          done
          [[ "$(sed '/^$/d' <<<"$export_runs" | wc -l | tr -d ' ')" == 1 ]]
          gh run watch "$export_runs" -R Otzaria/SefariaExport --exit-status
          echo "SefariaExport succeeded and dispatched exact manual-link synchronization."
