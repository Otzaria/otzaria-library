name: Weekly Otzaria pipeline

run-name: weekly immutable pipeline ${{ github.run_id }}-${{ github.run_attempt }}

on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-otzaria-pipeline
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # The orchestrator only waits for prepare (~7m) + the Sefaria export (~55m); 4h is
    # ample headroom yet bounds a stuck watch loop well below GitHub's implicit 6h job
    # ceiling, so a wedged wait can't silently burn a runner for hours.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository's current tree is ~10 GiB, while this coordinator
          # consumes only the exact-run helper.  Never download the book corpus
          # merely to dispatch and observe children.
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Prepare Otzaria sources, then export Sefaria
        shell: bash
        run: |
          set -euo pipefail

          find_exact_run() {
            local repo="$1" workflow="$2" title="$3" head_sha="$4" dispatched_at="$5"
            bash .github/scripts/find_exact_workflow_run.sh "$repo" "$workflow" "$title" "$head_sha" "$dispatched_at"
          }

          prepare_correlation="weekly:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:prepare"
          prepare_title="update-library mode=prepare_only correlation=${prepare_correlation}"
          prepare_head="$(gh api repos/Otzaria/otzaria-library/commits/main --jq .sha)"
          prepare_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Submit once. A non-zero response is delivery-ambiguous; exact-title
          # discovery below adopts a request that reached GitHub without replying.
          if ! gh workflow run update-library.yml -R Otzaria/otzaria-library \
            -f mode=prepare_only \
            -f correlation_id="$prepare_correlation"; then
            echo "::warning::prepare dispatch returned non-zero; checking exact identity before any retry"
          fi
          prepare_run="$(find_exact_run Otzaria/otzaria-library update-library.yml "$prepare_title" "$prepare_head" "$prepare_time")"
          # Low-frequency resilient wait (gh run watch polls every 3s and can
          # exhaust the shared API quota; transient errors must not kill the run).
          watch_run() {
            local repo="$1" rid="$2" label="$3" state
            while :; do
              state="$(gh api "repos/$repo/actions/runs/$rid" --jq '.status + ":" + (.conclusion // "")' 2>"$RUNNER_TEMP/wait-err.txt" || { grep -q "HTTP 401" "$RUNNER_TEMP/wait-err.txt" && echo fatal-auth || echo transient; })"
              case "$state" in
                completed:success) return 0 ;;
                completed:*) echo "::error::$label run $rid concluded ${state#completed:}"; return 1 ;;
                fatal-auth) echo "::error::$label watch: token rejected (HTTP 401) — dead credentials cannot heal, failing fast"; return 1 ;;
                *) sleep 60 ;;
              esac
            done
          }
          watch_run Otzaria/otzaria-library "$prepare_run" update-library

          # SefariaExport publishes an immutable release and dispatches the link
          # sync itself.  The weekly orchestrator neither races a publisher nor
          # chooses downstream release inputs.
          export_head="$(gh api repos/Otzaria/SefariaExport/commits/master --jq .sha)"
          export_correlation="weekly:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          export_title="Sefaria immutable export orchestration=$export_correlation"
          if ! gh workflow run release.yml -R Otzaria/SefariaExport \
            -f orchestration_id="$export_correlation"; then
            echo "::warning::SefariaExport dispatch returned non-zero; adopting only an exact run"
          fi
          export_run="$(find_exact_run Otzaria/SefariaExport release.yml "$export_title" "$export_head" "unused")"
          watch_run Otzaria/SefariaExport "$export_run" sefaria-export
          echo "SefariaExport succeeded and dispatched exact manual-link synchronization."
