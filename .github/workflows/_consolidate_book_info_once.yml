name: One-time book-info website PR consolidation
on:
  push:
    branches:
      - fix/consolidate-book-info-from-website-2026-11-11
    paths:
      - .github/workflows/_consolidate_book_info_once.yml
permissions:
  contents: write
jobs:
  consolidate:
    if: github.repository == 'Otzaria/otzaria-library'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only affected catalog sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/_consolidate_book_info_once.py
            .github/data/locked_metadata.tsv
            ForDB
            metadata.json
            all_metadata.json
            all_metadata_with_file_paths.json
      - name: Consolidate book-information edits and lock files
        run: python3 .github/scripts/_consolidate_book_info_once.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit all metadata changes to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ForDB/book_info.csv ForDB/book_info_identity.json ForDB/all_metadata.json ForDB/sefaria_metadata_changes.csv metadata.json all_metadata.json all_metadata_with_file_paths.json .github/data/locked_metadata.tsv
          git commit -m 'fix(catalog): consolidate 18 website book-info PRs with metadata locks'
          git push origin HEAD:fix/consolidate-book-info-from-website-2026-11-11
