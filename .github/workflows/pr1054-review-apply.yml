name: One-shot PR 1054 review correction
on:
  push:
    branches: [fix/pr1054-review-6789742852]

permissions:
  contents: write

concurrency:
  group: one-shot-pr1054-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only required metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          filter: blob:none
          lfs: false
          sparse-checkout: |
            /ForDB/book_info.csv
            /ForDB/book_info_identity.json
            /ForDB/sefaria_metadata_changes.csv
            /.github/data/locked_metadata.tsv
            /.github/scripts/pr1054_review_patch.py
            /.github/workflows/pr1054-review-apply.yml
            /metadata.json
          sparse-checkout-cone-mode: false

      - name: Apply fail-closed metadata-only correction
        env:
          EXPECTED_BASE_SHA: a40f52ea8ad93920a13072f64b196fd10f5a5a6f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          python3 .github/scripts/pr1054_review_patch.py
          git diff --check

      - name: Remove temporary tools and commit only the five metadata files
        run: |
          set -euo pipefail
          rm .github/workflows/pr1054-review-apply.yml .github/scripts/pr1054_review_patch.py
          git add -- \
            ForDB/book_info.csv \
            ForDB/book_info_identity.json \
            ForDB/sefaria_metadata_changes.csv \
            .github/data/locked_metadata.tsv \
            metadata.json \
            .github/scripts/pr1054_review_patch.py \
            .github/workflows/pr1054-review-apply.yml
          python3 - <<'PY'
          import subprocess
          expected = {
              "ForDB/book_info.csv",
              "ForDB/book_info_identity.json",
              "ForDB/sefaria_metadata_changes.csv",
              ".github/data/locked_metadata.tsv",
              "metadata.json",
              ".github/scripts/pr1054_review_patch.py",
              ".github/workflows/pr1054-review-apply.yml",
          }
          paths = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          assert paths == expected, f"Unexpected staged paths: {paths ^ expected}"
          PY
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address all PR #1054 metadata review comments"
          git push origin HEAD:refs/heads/fix/pr1054-review-6789742852
