name: Python tests

# כל חבילות ה-unittest של המאגר שאף workflow אחר לא מריץ ב-PR. כולן offline
# לחלוטין — אין רשת (מלבד התקנת PyYAML לפני ההרצה), אין gh
# (החבילות שמריצות סקריפט שותלות gh מזויף ב-PATH), אין LFS ואין runner פרטי —
# ולכן הן רצות על כל PR ללא paths filter: חבילה שבודקת workflow או
# סקריפט shell נשברת גם משינוי שלא נגע בקובץ שלה.
#
# מה לא רץ כאן ולמה:
#   .github/scripts/test_validate_fordb_book_names.py — רץ ב-validate-fordb-book-names.yml,
#     ה-job היחיד שכבר מושך את ForDB מ-LFS (RepositoryForDbTest קורא את ה-CSV-ים).
#   .github/scripts/test_fordb_book_renames.py — רץ לצידה, באותו צעד self-test.
#   .github/scripts/test_library_tree.py — גם הוא באותו צעד self-test.
#   .github/scripts/test_validate_manual_links_refs.py — כבר שער PR ב-validate-manual-links-refs.yml.
#   National-LibraryToOtzaria/סקריפטים/test_*.py — כבר שער PR ב-validate-national-library-normalizers.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # blobless + sparse: החבילות קוראות את ה-workflows, את .github/scripts,
      # את send_update/main.py ואת מודולי השורש שהן מייבאות בלבד —
      # תוכן הספרים (~10GiB) לא נדרש לאף אחת מהן.
      - name: Checkout the tested sources (sparse, blobless)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            /.github/
            /send_update/
            /.claude/skills/otzaria-db-linker/scripts/
            /.claude/skills/otzaria-db-ingestion-audit/scripts/
            /.claude/skills/otzaria-commentary-linker-qa/scripts/
            /.claude/skills/otzaria-book-format/scripts/
            /DictaToOtzaria/סקריפטים/
            /MoreBooks/סקריפטים/
            /OnYourWayToOtzaria/סקריפטים/ובלכתך_בדרך.py
            /OnYourWayToOtzaria/סקריפטים/test_onyourway_headings.py
            /OraytaToOtzaria/סקריפטים/orayta_convert.py
            /OraytaToOtzaria/סקריפטים/test_orayta_convert.py
            /ToratEmetToOtzaria/סקריפטים/te_convert.py
            /ToratEmetToOtzaria/סקריפטים/te_reapply.py
            /ToratEmetToOtzaria/סקריפטים/test_te_reapply.py
            /pninimToOtzaria/סקריפטים/
            /manual_links_sync.json
            /_insert_sfat_emet_links.py
            /manual_links_packaging.py
            /pipeline_result_contract.py
            /sefaria_release_chain.py
            /sync_and_merge_folders.py
            /verify_packaging_toolchain.py
            /test_insert_sfat_emet_links.py
            /test_manual_links_packaging.py
            /test_pipeline_result_contract.py
            /test_saga_contract.py
            /test_sefaria_release_chain.py
            /test_source_lists_contract.py
            /test_verify_packaging_toolchain.py
            /test_workflow_run_finder.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # discover מוצא רק את test_*.py בשורש: אין __init__.py בשום תיקייה, ולכן
      # הוא אינו נכנס ל-.github/ — אלה מורצות במפורש.
      - name: Repository-root suites
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s . -t . -p 'test_*.py'

      # Skill-script suites. Each one is self-contained (synthetic fixtures, a
      # throw-away sqlite DB); anything that needs a SeforimLibrary checkout or a
      # built seforim.db skips itself. Not under discover: .claude/ is no package.
      - name: Skill script suites
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          (cd .claude/skills/otzaria-commentary-linker-qa/scripts && python3 -m unittest -v test_check_daf)
          (cd .claude/skills/otzaria-book-format/scripts && python3 -m unittest -v test_connection_types)
          (cd .claude/skills/otzaria-db-linker/scripts && python3 -m unittest -v test_insert_commentary_link)
          (cd .claude/skills/otzaria-db-ingestion-audit/scripts && python3 -m unittest -v test_audit_ingestion)

      # ממיר דיקטה, כלי העריכה, וזרימת הייבוא החודשית (dicta_sync / dicta-import.yml).
      # offline; קוראת את manual_links_sync.json ואת רשימות השורשים הנארזים.
      - name: Dicta import suites
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s "DictaToOtzaria/סקריפטים/tests"

      # install.py של MoreBooks נטענים לבד, מוצאים את שורש הריפו ויעדיהם קיימים בעץ (git ls-tree).
      - name: MoreBooks install scripts
        working-directory: MoreBooks/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest -v test_install_paths

      # ממיר אורייתא: סוגר ")" של הערות העורך (גמרא נוחה), טקסט סינתטי בלבד.
      - name: Orayta converter suite
        working-directory: OraytaToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest -v test_orayta_convert

      # כלי ההמרה של תורת אמת (te_convert / te_reapply): שורות ומקורות סינתטיים,
      # בלי קובצי המקור של תורת אמת.
      - name: Torat Emet tools suite
        working-directory: ToratEmetToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest -v test_te_reapply

      # ממיר ובלכתך בדרך: רמות הכותרות (book/chap/p), על XML סינתטי.
      - name: OnYourWay converter suite
        working-directory: OnYourWayToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 -m pip install --quiet beautifulsoup4 lxml
          python3 -m unittest -v test_onyourway_headings

      # ממירי פנינים (merge_books / manipulate / to_otzaria): קבצים סינתטיים בלבד.
      - name: Pninim converters suite
        working-directory: pninimToOtzaria/סקריפטים
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 -m pip install --quiet beautifulsoup4
          python3 -m unittest -v test_pninim_converters test_to_otzaria

      # רשימה מפורשת ולא discover: test_validate_fordb_book_names ו-
      # test_validate_manual_links_refs יושבות באותה תיקייה ורצות ב-workflows אחרים.
      - name: .github/scripts suites
        working-directory: .github/scripts
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          # setup-python אינו מביא PyYAML, ובלעדיו שתי הבדיקות שטוענות על פענוח
          # ה-workflows (test_the_workflow_parses ו-
          # test_every_run_body_is_valid_yaml_and_valid_bash) מדלגות בשקט — בדיוק
          # החור ש-sync-manual-links.yml סוגר באותה שורה. זו הנגיעה היחידה ברשת;
          # הבדיקות עצמן עדיין offline לחלוטין.
          python3 -m pip install --quiet pyyaml
          python3 -m unittest -v \
            test_manual_links_observability \
            test_reconcile_sagas \
            test_release_consumers \
            test_saga_continue_workflow \
            test_send_update \
            test_weekly_pipeline
