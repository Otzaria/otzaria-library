name: Update ForDB release

# מפרסם release עם כלל תוכן תיקיית ForDB.
# רץ אוטומטית בכל שינוי בתיקיית ForDB (push ל-main), וגם ניתן להפעלה ידנית.
#
# כל payload מתפרסם תחת tag ממוען-תוכן, ללא clobber. הקובץ
# fordb_latest_pointer.json ב-main הוא המצביע האטומי היחיד ל-last-good.

on:
  push:
    branches:
      - main
    paths:
      - "ForDB/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # מונע ריצות מקבילות שעלולות להתנגש על אותו תג release
  group: update-fordb
  cancel-in-progress: false

jobs:
  publish-fordb:
    runs-on: ubuntu-latest
    # Includes a multi-GB DB download + fresh Gradle compile + full real-consumer
    # validation. Keep a finite ceiling but allow normal network/cache variance.
    timeout-minutes: 180
    concurrency:
      group: otzaria-main-writer
      cancel-in-progress: false
      queue: max

    env:
      ARCHIVE_NAME: fordb_latest.zip
      SRC_DIR: ForDB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull LFS objects for packaging
        run: |
          git lfs pull
          git lfs checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Publish gate: the atomic pointer must only advance to validation-passing content. Run
      # the report-only validator BEFORE packaging — if it fails (exit 1 = ForDB names
      # need a fix; exit 2 = Sefaria fetch failed), we do NOT publish, so a bad ForDB push
      # leaves the pointer on its last-good immutable release.
      - name: Validate ForDB before publishing (report-only gate)
        env:
          SEFARIA_FETCH: "1"
          PYTHONIOENCODING: "utf-8"
        run: python3 .github/scripts/validate_fordb_book_names.py

      - name: Create ForDB archive
        run: |
          set -euo pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          if [ ! -d "$SRC_DIR" ]; then
            echo "Source directory '$SRC_DIR' not found." >&2
            exit 1
          fi

          echo "Creating deterministic ZIP archive of '$SRC_DIR'..."
          # Stored (uncompressed) entries, fixed timestamp/mode and bytewise path
          # ordering make the exact archive a pure function of file names+bytes;
          # runner zlib upgrades and source mtimes cannot mint a different digest.
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("ForDB")
          paths=sorted((p for p in root.rglob("*") if p.name!=".DS_Store"),key=lambda p:p.as_posix().encode())
          if any(p.is_symlink() for p in paths): raise SystemExit("ForDB archive refuses symlinks")
          with zipfile.ZipFile("fordb_latest.zip","w",compression=zipfile.ZIP_STORED) as archive:
              for path in paths:
                  if not path.is_file(): continue
                  info=zipfile.ZipInfo(path.as_posix(),date_time=(1980,1,1,0,0,0))
                  info.create_system=3
                  info.external_attr=0o100644 << 16
                  info.compress_type=zipfile.ZIP_STORED
                  archive.writestr(info,path.read_bytes())
          PY

          echo "Archive contents:"
          unzip -l "$GITHUB_WORKSPACE/$ARCHIVE_NAME"

      # ── Deep gate: dry-run the CANDIDATE against the last released DB ──
      # The name-validator above catches canonical-name drift; THIS gate catches the
      # original build-killer class (a category path in book_moves/category_moves that
      # no longer resolves — the "מהרש"ם" incident): it runs the REAL Kotlin appliers
      # (validateForDbInputs) in a rolled-back transaction against the last released
      # seforim.db, reporting EVERY broken rule at once. A failure blocks the publish,
      # so the pointer stays at last-good and the weekly build stays green.
      # The released DB is a strong approximation of the next build's tree; the build
      # itself re-runs the same collector as an exact pre-mutation preflight (defence
      # in depth), so a rule that only breaks against next week's tree still fails
      # loudly before any mutation.
      - name: Free disk space for the released DB dry-run
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Set up Java 25 for the dry-run
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Checkout the SeforimLibrary tool
        uses: actions/checkout@v6
        with:
          repository: Otzaria/SeforimLibrary
          ref: otzaria
          token: ${{ secrets.PIPELINE_TOKEN }}
          path: seforim-tool
          persist-credentials: false

      - name: Dry-run every candidate input against the last released seforim.db
        id: deep_gate
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN secret is empty or missing on this repo"; exit 1; }
          # Newest release INCLUDING pre-releases (the weekly publishes pre-releases;
          # `gh release view` with no tag would lag far behind).
          LIB_TAG=$(gh release list -R Otzaria/SeforimLibrary -L1 --json tagName -q '.[0].tagName')
          echo "Dry-running against SeforimLibrary release $LIB_TAG"
          gh release download "$LIB_TAG" -R Otzaria/SeforimLibrary -p 'seforim.db.zst' -D dbdir
          DB_ASSET_DIGEST="$(gh release view "$LIB_TAG" -R Otzaria/SeforimLibrary --json assets \
            --jq '.assets[] | select(.name=="seforim.db.zst") | .digest')"
          [[ "$DB_ASSET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(sha256sum dbdir/seforim.db.zst | cut -d' ' -f1)" == "${DB_ASSET_DIGEST#sha256:}" ]]
          unzstd -f dbdir/seforim.db.zst
          rm -f dbdir/seforim.db.zst
          CANDIDATE_SHA=$(sha256sum "$GITHUB_WORKSPACE/$ARCHIVE_NAME" | cut -d' ' -f1)
          ( cd seforim-tool && chmod +x gradlew && ./gradlew :sefariasqlite:validateForDbInputs \
              -PseforimDb="$GITHUB_WORKSPACE/dbdir/seforim.db" \
              -PforDbArchive="$GITHUB_WORKSPACE/$ARCHIVE_NAME" \
              -PforDbSha256="$CANDIDATE_SHA" \
              --no-daemon )
          echo "library_tag=$LIB_TAG" >> "$GITHUB_OUTPUT"
          echo "tool_sha=$(git -C seforim-tool rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf dbdir

      - name: Publish immutable ForDB release and atomically advance the git pointer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_LIBRARY_TAG: ${{ steps.deep_gate.outputs.library_tag }}
          VALIDATOR_TOOL_SHA: ${{ steps.deep_gate.outputs.tool_sha }}
        run: |
          set -euo pipefail
          archive_sha="$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)"
          archive_size="$(stat -c %s "$ARCHIVE_NAME")"
          immutable_tag="fordb-sha256-$archive_sha"
          jq -cS -n \
            --arg archive_name "$ARCHIVE_NAME" --arg archive_sha "$archive_sha" \
            --argjson archive_size "$archive_size" --arg source_commit "$GITHUB_SHA" \
            --arg validator_tool_sha "$VALIDATOR_TOOL_SHA" \
            --arg validated_library_tag "$VALIDATED_LIBRARY_TAG" \
            '{schema_version:1,archive:{name:$archive_name,sha256:$archive_sha,size:$archive_size},source_commit:$source_commit,validator_tool_sha:$validator_tool_sha,validated_library_tag:$validated_library_tag}' \
            > fordb_provenance.json

          rm -rf fordb-verify && mkdir fordb-verify
          list_releases() {
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > fordb-verify/releases.json
          }
          find_release_id() {
            jq -er --arg tag "$immutable_tag" '
              add | map(select(.tag_name == $tag)) |
              if length == 0 then ""
              elif length == 1 and (.[0].id | type) == "number" and .[0].id > 0 then .[0].id
              else error("expected at most one ForDB release for the immutable tag") end
            ' fordb-verify/releases.json
          }
          list_releases
          release_id="$(find_release_id)"
          if [ -z "$release_id" ]; then
            gh release create "$immutable_tag" --draft --latest=false --target "$GITHUB_SHA" \
              --title "$immutable_tag" --notes "Immutable validated ForDB payload sha256:$archive_sha" \
              "$ARCHIVE_NAME" fordb_provenance.json
            list_releases
            release_id="$(find_release_id)"
          fi
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          verify_remote() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" > fordb-verify/release.json
            ARCHIVE_NAME="$ARCHIVE_NAME" ARCHIVE_SHA="$archive_sha" ARCHIVE_SIZE="$archive_size" \
              IMMUTABLE_TAG="$immutable_tag" SOURCE_COMMIT="$GITHUB_SHA" \
              python3 - fordb-verify/release.json <<'PY'
          import json,os,re,sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text())
          if value.get("tag_name") != os.environ["IMMUTABLE_TAG"] or value.get("target_commitish") != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("ForDB release identity/target mismatch")
          if type(value.get("draft")) is not bool:
              raise SystemExit("ForDB release draft state is invalid")
          assets={item["name"]:(item["id"],item["size"],item.get("digest")) for item in value["assets"]}
          if set(assets)!={os.environ["ARCHIVE_NAME"],"fordb_provenance.json"}: raise SystemExit("unexpected ForDB release asset set")
          archive_id,size,digest=assets[os.environ["ARCHIVE_NAME"]]
          if type(archive_id) is not int or archive_id<1 or (size,digest)!=(int(os.environ["ARCHIVE_SIZE"]),"sha256:"+os.environ["ARCHIVE_SHA"]): raise SystemExit("remote ForDB archive descriptor mismatch")
          provenance_id,size,digest=assets["fordb_provenance.json"]
          if type(provenance_id) is not int or provenance_id<1 or type(size) is not int or size<1 or type(digest) is not str or not re.fullmatch(r"sha256:[0-9a-f]{64}",digest): raise SystemExit("invalid remote provenance descriptor")
          PY
          }
          verified=false
          for _ in $(seq 1 12); do if verify_remote; then verified=true; break; fi; sleep 5; done
          [ "$verified" = true ]
          provenance_asset_id="$(jq -er '.assets[] | select(.name=="fordb_provenance.json") | .id' fordb-verify/release.json)"
          [[ "$provenance_asset_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/$provenance_asset_id" > fordb-verify/fordb_provenance.json
          remote_provenance_sha="$(sha256sum fordb-verify/fordb_provenance.json | cut -d' ' -f1)"
          [[ "$(jq -r '.assets[]|select(.name=="fordb_provenance.json")|.digest' fordb-verify/release.json)" == "sha256:$remote_provenance_sha" ]]
          ARCHIVE_NAME="$ARCHIVE_NAME" ARCHIVE_SHA="$archive_sha" ARCHIVE_SIZE="$archive_size" \
            python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path("fordb-verify/fordb_provenance.json")
          def pairs(items):
              value = {}
              for key, item in items:
                  if key in value:
                      raise SystemExit(f"duplicate ForDB provenance key: {key}")
                  value[key] = item
              return value
          value = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs)
          if set(value) != {"schema_version", "archive", "source_commit", "validator_tool_sha", "validated_library_tag"}:
              raise SystemExit("unknown ForDB provenance key set")
          if type(value["schema_version"]) is not int or value["schema_version"] != 1:
              raise SystemExit("invalid ForDB provenance schema version")
          archive = value["archive"]
          if not isinstance(archive, dict) or set(archive) != {"name", "sha256", "size"}:
              raise SystemExit("invalid ForDB archive descriptor")
          if archive != {
              "name": os.environ["ARCHIVE_NAME"],
              "sha256": os.environ["ARCHIVE_SHA"],
              "size": int(os.environ["ARCHIVE_SIZE"]),
          }:
              raise SystemExit("ForDB provenance archive descriptor mismatch")
          for field in ("source_commit", "validator_tool_sha"):
              if type(value[field]) is not str or not re.fullmatch(r"[0-9a-f]{40}", value[field]):
                  raise SystemExit(f"invalid ForDB provenance {field}")
          tag = value["validated_library_tag"]
          if type(tag) is not str or not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", tag):
              raise SystemExit("invalid ForDB provenance validated_library_tag")
          canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if path.read_bytes() != canonical:
              raise SystemExit("ForDB provenance is not canonical JSON")
          Path("fordb-verify/source-commit.txt").write_text(value["source_commit"] + "\n", encoding="ascii")
          PY
          provenance_source="$(cat fordb-verify/source-commit.txt)"
          if [ "$(jq -r .draft fordb-verify/release.json)" = true ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
              -F draft=false -f make_latest=false > fordb-verify/published-release.json
          fi
          encoded_tag="$(jq -rn --arg value "$immutable_tag" '$value|@uri')"
          published=false
          for _ in $(seq 1 12); do
            verify_remote || { sleep 5; continue; }
            tag_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$encoded_tag" --jq .object.sha 2>/dev/null || true)"
            if [ "$(jq -r .draft fordb-verify/release.json)" = false ] && [ "$tag_target" = "$provenance_source" ]; then
              published=true
              break
            fi
            sleep 5
          done
          [ "$published" = true ]

          jq -cS -n --arg tag "$immutable_tag" --arg sha "$archive_sha" \
            --arg provenance_sha "$remote_provenance_sha" \
            '{schema_version:1,tag:$tag,asset:"fordb_latest.zip",sha256:$sha,provenance_asset:"fordb_provenance.json",provenance_sha256:$provenance_sha}' \
            > fordb_latest_pointer.json
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add fordb_latest_pointer.json
          git diff --cached --quiet || git commit -m "chore(fordb): advance immutable pointer [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published $immutable_tag and advanced fordb_latest_pointer.json"
