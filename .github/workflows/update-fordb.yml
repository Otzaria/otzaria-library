name: Update ForDB release

# מפרסם release עם כלל תוכן תיקיית ForDB.
# רץ אוטומטית בכל שינוי בתיקיית ForDB (push ל-main), וגם ניתן להפעלה ידנית.
#
# כל payload מתפרסם תחת tag ממוען-תוכן, ללא clobber. הקובץ
# fordb_latest_pointer.json ב-main הוא המצביע האטומי היחיד ל-last-good.
#
# ריצה שנכשלה או שהוחלפה בתור אינה חוזרת מעצמה, ושום push נוסף ל-ForDB אינו מגיע בהכרח.
# לכן ריצה יומית מתוזמנת: אם תוכן הארכיב ב-main שונה ממה שהמצביע מצביע עליו, היא מפרסמת;
# אחרת (וכך גם ב-push שלא שינה את תוכן הארכיב, למשל README) היא מסתיימת בלי השער הכבד.

on:
  push:
    branches:
      - main
    paths:
      - "ForDB/**"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # מונע ריצות מקבילות שעלולות להתנגש על אותו תג release
  group: update-fordb
  cancel-in-progress: false

jobs:
  publish-fordb:
    needs: freshness
    if: ${{ needs.freshness.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    # Includes a multi-GB DB download + fresh Gradle compile + full real-consumer
    # validation. Keep a finite ceiling but allow normal network/cache variance.
    timeout-minutes: 180
    concurrency:
      group: otzaria-main-writer
      cancel-in-progress: false
      queue: max

    env:
      ARCHIVE_NAME: fordb_latest.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The identity ledger gate compares HEAD^ to reject rewritten history.
          fetch-depth: 2
          # The gate only reads ForDB, the validator, and its canonical metadata.
          # Fetching every LFS object in this multi-GB repository dominated runtime.
          lfs: false
          sparse-checkout: |
            /ForDB/
            /.github/scripts/
            /.github/data/locked_metadata.tsv
            /.github/workflows/validate-fordb-book-names.yml
            /.github/workflows/update-fordb.yml
            /all_metadata_with_file_paths.json
            /fordb_latest_pointer.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hydrate only possible ForDB inputs from LFS
        run: |
          set -euo pipefail
          # There are no LFS files in these inputs today. Keep the targeted pull so
          # a future migration to LFS cannot silently package pointer text.
          git lfs install --local
          git lfs pull --include="ForDB/**,all_metadata_with_file_paths.json" --exclude=""
          test -d ForDB
          test -f all_metadata_with_file_paths.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Publish gate: the atomic pointer must only advance to validation-passing content. Run
      # the report-only validator BEFORE packaging — if it fails (exit 1 = ForDB names
      # need a fix; exit 2 = Sefaria fetch failed), we do NOT publish, so a bad ForDB push
      # leaves the pointer on its last-good immutable release.
      - name: Validate ForDB before publishing (report-only gate)
        env:
          SEFARIA_FETCH: "1"
          PYTHONIOENCODING: "utf-8"
        run: python3 .github/scripts/validate_fordb_book_names.py

      # ערכים נעולים בקובצי ForDB (שמות קנוניים ותיאורי ספרים): ערך נעול שנדרס לא מתפרסם.
      # author ו-line2 אינם ב-ForDB ונבדקים ב-validate-fordb-book-names.yml.
      - name: Check locked ForDB values
        env:
          PYTHONIOENCODING: "utf-8"
        run: python3 .github/scripts/check_locked_metadata.py --skip author --skip line2

      # The archive and its coverage check live in fordb_archive.py, shared with the
      # candidate archive of validate-fordb-book-names.yml.
      - name: Create ForDB archive
        run: |
          set -euo pipefail
          python3 .github/scripts/fordb_archive.py build "$ARCHIVE_NAME"
          echo "Archive contents:"
          unzip -l "$GITHUB_WORKSPACE/$ARCHIVE_NAME"

      # ── Deep gate: dry-run the CANDIDATE against the last released DB ──
      # The name-validator above catches canonical-name drift; THIS gate catches the
      # original build-killer class (a category path in book_moves/category_moves that
      # no longer resolves — the "מהרש"ם" incident): it runs the REAL Kotlin appliers
      # (validateForDbInputs) in a rolled-back transaction against the last released
      # seforim.db, reporting EVERY broken rule at once. A failure blocks the publish,
      # so the pointer stays at last-good and the weekly build stays green.
      # The released DB is a strong approximation of the next build's tree; the build
      # itself re-runs the same collector as an exact pre-mutation preflight (defence
      # in depth), so a rule that only breaks against next week's tree still fails
      # loudly before any mutation.
      # ה-runner מגיע עם ~86GB פנויים והשיא של ה-dry-run כ-8-12GB, והניקוי לקח 2-11 דקות.
      # מנקים רק אם המקום הפנוי נמוך מהסף.
      - name: Check free disk space
        id: disk
        run: |
          set -euo pipefail
          df -h /
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available=${AVAIL_GB}GB"
          if [ "$AVAIL_GB" -lt 40 ]; then
            echo "low=true" >> "$GITHUB_OUTPUT"
          else
            echo "low=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space for the released DB dry-run
        if: ${{ steps.disk.outputs.low == 'true' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Set up Java 25 for the dry-run
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Checkout the SeforimLibrary tool
        uses: actions/checkout@v6
        with:
          repository: Otzaria/SeforimLibrary
          ref: otzaria
          token: ${{ secrets.PIPELINE_TOKEN }}
          path: seforim-tool
          persist-credentials: false

      - name: Self-test released DB downloads
        env:
          SEFORIM_TOOL_DIR: ${{ github.workspace }}/seforim-tool
        run: python3 -m unittest discover -s .github/scripts -p test_download_released_fordb_db.py -v

      # מטמון Gradle משותף עם validate-fordb-book-names.yml: אותו מפתח, אותו כלי ואותה
      # משימה. ראו שם את ההסבר. כאן נקרא ונכתב רק ב-main (ה-workflow רץ רק שם).
      - name: Resolve the SeforimLibrary tool commit
        id: tool
        run: echo "sha=$(git -C seforim-tool rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-seforim-${{ runner.os }}-${{ steps.tool.outputs.sha }}
          restore-keys: |
            gradle-seforim-${{ runner.os }}-

      - name: Dry-run every candidate input against the last released seforim.db
        id: deep_gate
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN secret is empty or missing on this repo"; exit 1; }
          # Workflow handoffs are pre-releases and do not contain a database.
          # Validate only against the newest final release that carries a DB
          # (final vector QA releases do not).
          LIB_TAG=$(bash .github/scripts/select_released_db_tag.sh seforim-tool)
          test -n "$LIB_TAG"
          echo "Dry-running against SeforimLibrary release $LIB_TAG"
          # Schema-qualified names and split archives follow the producer's contract.
          # Authenticate the DB, allocator state and provenance before the dry-run.
          bash .github/scripts/download_released_fordb_db.sh "$LIB_TAG" dbdir seforim-tool
          CANDIDATE_SHA=$(sha256sum "$GITHUB_WORKSPACE/$ARCHIVE_NAME" | cut -d' ' -f1)
          ( cd seforim-tool && chmod +x gradlew && ./gradlew :sefariasqlite:validateForDbInputs \
              -PseforimDb="$GITHUB_WORKSPACE/dbdir/seforim.db" \
              -PforDbArchive="$GITHUB_WORKSPACE/$ARCHIVE_NAME" \
              -PforDbSha256="$CANDIDATE_SHA" \
              --build-cache \
              --no-daemon )
          echo "library_tag=$LIB_TAG" >> "$GITHUB_OUTPUT"
          echo "tool_sha=$(git -C seforim-tool rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf dbdir

      - name: Save Gradle cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-seforim-${{ runner.os }}-${{ steps.tool.outputs.sha }}

      - name: Publish immutable ForDB release and atomically advance the git pointer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_LIBRARY_TAG: ${{ steps.deep_gate.outputs.library_tag }}
          VALIDATOR_TOOL_SHA: ${{ steps.deep_gate.outputs.tool_sha }}
        run: |
          set -euo pipefail
          archive_sha="$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)"
          archive_size="$(stat -c %s "$ARCHIVE_NAME")"
          immutable_tag="fordb-sha256-$archive_sha"
          write_provenance() {
            jq -cS -n \
              --arg archive_name "$ARCHIVE_NAME" --arg archive_sha "$archive_sha" \
              --argjson archive_size "$archive_size" --arg source_commit "$1" \
              --arg validator_tool_sha "$VALIDATOR_TOOL_SHA" \
              --arg validated_library_tag "$VALIDATED_LIBRARY_TAG" \
              '{schema_version:1,archive:{name:$archive_name,sha256:$archive_sha,size:$archive_size},source_commit:$source_commit,validator_tool_sha:$validator_tool_sha,validated_library_tag:$validated_library_tag}' \
              > fordb_provenance.json
          }

          rm -rf fordb-verify && mkdir fordb-verify
          list_releases() {
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > fordb-verify/releases.json
          }
          find_release_id() {
            jq -r --arg tag "$immutable_tag" '
              add | map(select(.tag_name == $tag)) |
              if length == 0 then ""
              elif length == 1 and (.[0].id | type) == "number" and .[0].id > 0 then .[0].id
              else error("expected at most one ForDB release for the immutable tag") end
            ' fordb-verify/releases.json
          }
          # GitHub refuses GITHUB_TOKEN a new tag on a commit whose .github/workflows differs
          # from main's tip ("HTTP 403: Resource not accessible by integration", runs 40227285093
          # and 40227471966): main had moved on to a workflow change while the run waited for the
          # gate. The tag therefore goes on main's current tip whenever that tip ships the same
          # ForDB files; when main changed ForDB since, the run for that change (or the daily
          # run) publishes instead. A lost race with another push is retried on fresh main.
          # A draft left by a failed run is never consumed and carries an old target, so it is
          # deleted and created again here rather than published as it is.
          release_id=""
          for attempt in 1 2 3 4 5; do
            list_releases
            release_id="$(find_release_id)"
            if [ -n "$release_id" ]; then
              if [ "$(jq -r --arg tag "$immutable_tag" 'add | map(select(.tag_name == $tag))[0].draft' fordb-verify/releases.json)" != true ]; then
                break
              fi
              echo "deleting the leftover draft $release_id of $immutable_tag"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id"
              release_id=""
            fi
            git fetch --no-tags origin main
            target="$(git rev-parse FETCH_HEAD)"
            same=0
            python3 .github/scripts/fordb_archive.py same-content "$GITHUB_SHA" "$target" || same=$?
            if [ "$same" = 3 ]; then
              echo "::notice::ForDB changed on main after $GITHUB_SHA; the run for that change (or the daily run) publishes it"
              exit 0
            fi
            [ "$same" = 0 ]
            write_provenance "$target"
            if gh release create "$immutable_tag" --draft --latest=false --target "$target" \
                --title "$immutable_tag" --notes "Immutable validated ForDB payload sha256:$archive_sha" \
                "$ARCHIVE_NAME" fordb_provenance.json; then
              for _ in $(seq 1 12); do
                list_releases
                release_id="$(find_release_id)"
                [ -n "$release_id" ] && break
                sleep 5
              done
              break
            fi
            echo "release create attempt $attempt failed; retrying on fresh main"
            sleep $((attempt * 5))
          done
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          verify_remote() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" > fordb-verify/release.json
            ARCHIVE_NAME="$ARCHIVE_NAME" ARCHIVE_SHA="$archive_sha" ARCHIVE_SIZE="$archive_size" \
              IMMUTABLE_TAG="$immutable_tag" \
              python3 - fordb-verify/release.json <<'PY'
          import json,os,re,sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text())
          if value.get("tag_name") != os.environ["IMMUTABLE_TAG"]:
              raise SystemExit("ForDB release tag mismatch")
          if type(value.get("target_commitish")) is not str or not re.fullmatch(r"[0-9a-f]{40}", value["target_commitish"]):
              raise SystemExit("ForDB release target is not a full commit")
          if type(value.get("draft")) is not bool:
              raise SystemExit("ForDB release draft state is invalid")
          assets={item["name"]:(item["id"],item["size"],item.get("digest")) for item in value["assets"]}
          if set(assets)!={os.environ["ARCHIVE_NAME"],"fordb_provenance.json"}: raise SystemExit("unexpected ForDB release asset set")
          archive_id,size,digest=assets[os.environ["ARCHIVE_NAME"]]
          if type(archive_id) is not int or archive_id<1 or (size,digest)!=(int(os.environ["ARCHIVE_SIZE"]),"sha256:"+os.environ["ARCHIVE_SHA"]): raise SystemExit("remote ForDB archive descriptor mismatch")
          provenance_id,size,digest=assets["fordb_provenance.json"]
          if type(provenance_id) is not int or provenance_id<1 or type(size) is not int or size<1 or type(digest) is not str or not re.fullmatch(r"sha256:[0-9a-f]{64}",digest): raise SystemExit("invalid remote provenance descriptor")
          PY
          }
          verified=false
          for _ in $(seq 1 12); do if verify_remote; then verified=true; break; fi; sleep 5; done
          [ "$verified" = true ]
          provenance_asset_id="$(jq -er '.assets[] | select(.name=="fordb_provenance.json") | .id' fordb-verify/release.json)"
          [[ "$provenance_asset_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/$provenance_asset_id" > fordb-verify/fordb_provenance.json
          remote_provenance_sha="$(sha256sum fordb-verify/fordb_provenance.json | cut -d' ' -f1)"
          [[ "$(jq -r '.assets[]|select(.name=="fordb_provenance.json")|.digest' fordb-verify/release.json)" == "sha256:$remote_provenance_sha" ]]
          ARCHIVE_NAME="$ARCHIVE_NAME" ARCHIVE_SHA="$archive_sha" ARCHIVE_SIZE="$archive_size" \
            python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path("fordb-verify/fordb_provenance.json")
          def pairs(items):
              value = {}
              for key, item in items:
                  if key in value:
                      raise SystemExit(f"duplicate ForDB provenance key: {key}")
                  value[key] = item
              return value
          value = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs)
          if set(value) != {"schema_version", "archive", "source_commit", "validator_tool_sha", "validated_library_tag"}:
              raise SystemExit("unknown ForDB provenance key set")
          if type(value["schema_version"]) is not int or value["schema_version"] != 1:
              raise SystemExit("invalid ForDB provenance schema version")
          archive = value["archive"]
          if not isinstance(archive, dict) or set(archive) != {"name", "sha256", "size"}:
              raise SystemExit("invalid ForDB archive descriptor")
          if archive != {
              "name": os.environ["ARCHIVE_NAME"],
              "sha256": os.environ["ARCHIVE_SHA"],
              "size": int(os.environ["ARCHIVE_SIZE"]),
          }:
              raise SystemExit("ForDB provenance archive descriptor mismatch")
          for field in ("source_commit", "validator_tool_sha"):
              if type(value[field]) is not str or not re.fullmatch(r"[0-9a-f]{40}", value[field]):
                  raise SystemExit(f"invalid ForDB provenance {field}")
          tag = value["validated_library_tag"]
          if type(tag) is not str or not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", tag):
              raise SystemExit("invalid ForDB provenance validated_library_tag")
          canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          if path.read_bytes() != canonical:
              raise SystemExit("ForDB provenance is not canonical JSON")
          Path("fordb-verify/source-commit.txt").write_text(value["source_commit"] + "\n", encoding="ascii")
          PY
          provenance_source="$(cat fordb-verify/source-commit.txt)"
          [[ "$(jq -r .target_commitish fordb-verify/release.json)" == "$provenance_source" ]]
          if [ "$(jq -r .draft fordb-verify/release.json)" = true ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
              -F draft=false -f make_latest=false > fordb-verify/published-release.json
          fi
          encoded_tag="$(jq -rn --arg value "$immutable_tag" '$value|@uri')"
          published=false
          for _ in $(seq 1 12); do
            verify_remote || { sleep 5; continue; }
            tag_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$encoded_tag" --jq .object.sha 2>/dev/null || true)"
            if [ "$(jq -r .draft fordb-verify/release.json)" = false ] && [ "$tag_target" = "$provenance_source" ]; then
              published=true
              break
            fi
            sleep 5
          done
          [ "$published" = true ]

          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          # ה-checkout נעשה על ה-SHA שהפעיל את הריצה, וריצה שחיכתה בתור (queue: max)
          # רואה מצביע ישן שריצה קודמת כבר קידמה. לכן כותבים את המצביע מחדש על
          # קצה main העדכני במקום rebase שמתנגש על אותו קובץ. אם main התקדם
          # בין ה-fetch ל-push, חוזרים על הסבב.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            jq -cS -n --arg tag "$immutable_tag" --arg sha "$archive_sha" \
              --arg provenance_sha "$remote_provenance_sha" \
              '{schema_version:1,tag:$tag,asset:"fordb_latest.zip",sha256:$sha,provenance_asset:"fordb_provenance.json",provenance_sha256:$provenance_sha}' \
              > fordb_latest_pointer.json
            git add fordb_latest_pointer.json
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "chore(fordb): advance immutable pointer [skip ci]"
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "push attempt $attempt lost the race; retrying on fresh main"
            sleep $((attempt * 3))
          done
          [ "$pushed" = true ]
          echo "Published $immutable_tag and advanced fordb_latest_pointer.json"

  # הבדיקה הזולה לפני השער הכבד: האם הארכיב שהקומיט הזה היה מפרסם שונה ממה שהמצביע
  # מצביע עליו. ממוקם אחרי publish-fordb בקובץ: ה-checkout הראשון בקובץ הוא של המפרסם.
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - name: Checkout ForDB and the pointer
        uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: |
            /ForDB/
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Hydrate only possible ForDB inputs from LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="ForDB/**" --exclude=""

      # אותו פייתון כמו ב-publish-fordb, כדי שהארכיב ייבנה באותם בתים.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # המצביע נקרא מקצה main ולא מהקומיט של הריצה: ריצה שהמתינה בתור ותוכנה כבר פורסם
      # בידי ריצה אחרת אינה צריכה את השער הכבד.
      - name: Compare the archive with the published pointer
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fordb_archive.py build candidate.zip
          candidate="$(sha256sum candidate.zip | cut -d' ' -f1)"
          published="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/fordb_latest_pointer.json?ref=main" | jq -er .sha256)"
          if [ "$candidate" = "$published" ]; then
            echo "::notice::ForDB at $GITHUB_SHA is already published ($published)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "ForDB at $GITHUB_SHA ($candidate) differs from the pointer ($published)"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
