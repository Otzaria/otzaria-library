name: Validate National Library normalizers

on:
  pull_request:
    paths:
      - "National-LibraryToOtzaria/סקריפטים/**"
      - ".github/workflows/validate-national-library-normalizers.yml"
  push:
    branches:
      - main
    paths:
      - "National-LibraryToOtzaria/סקריפטים/**"
      - ".github/workflows/validate-national-library-normalizers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout normalizer tests
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /National-LibraryToOtzaria/סקריפטים/fix_marker_breaks.py
            /National-LibraryToOtzaria/סקריפטים/fix_missing_spaces.py
            /National-LibraryToOtzaria/סקריפטים/italic_quotes_to_bold.py
            /National-LibraryToOtzaria/סקריפטים/normalize_source.py
            /National-LibraryToOtzaria/סקריפטים/span_styles.py
            /National-LibraryToOtzaria/סקריפטים/test_fix_marker_breaks.py
            /National-LibraryToOtzaria/סקריפטים/test_fix_missing_spaces.py
            /National-LibraryToOtzaria/סקריפטים/test_italic_quotes_to_bold.py
            /National-LibraryToOtzaria/סקריפטים/test_normalize_source.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install beautifulsoup4

      - name: Run normalizer tests
        working-directory: National-LibraryToOtzaria/סקריפטים
        run: |
          python3 test_fix_marker_breaks.py
          python3 test_fix_missing_spaces.py
          python3 test_normalize_source.py
          python3 test_italic_quotes_to_bold.py
